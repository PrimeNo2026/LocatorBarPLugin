name: Build & Release

# Erwartet, dass "locator-privacy.zip" unverändert im Wurzelverzeichnis
# des Repositories liegt. Entpackt sie selbst innerhalb von GitHub Actions
# (du musst die ZIP also NICHT auf deinem eigenen Rechner entpacken),
# baut die JAR mit Maven und hängt sie bei einem Tag-Push als Release an.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: ZIP entpacken
        run: unzip -o locator-privacy.zip -d extracted

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: extracted/locator-privacy/pom.xml

      - name: Mit Maven bauen
        working-directory: extracted/locator-privacy
        run: mvn -B clean package

      - name: JAR als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: locator-privacy-jar
          path: extracted/locator-privacy/target/locator-privacy-*.jar
          if-no-files-found: error

      - name: GitHub Release erstellen (nur bei Tag-Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: extracted/locator-privacy/target/locator-privacy-*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
